<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mem0AI 记忆查询系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .query-form {
            padding: 30px;
            background: #f8f9fa;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #4facfe;
        }
        
        .btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .results-section {
            padding: 30px;
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e1e5e9;
        }
        
        .results-count {
            font-size: 1.2em;
            color: #666;
        }
        
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        
        .memory-card {
            background: white;
            border: 1px solid #e1e5e9;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        
        .memory-card:hover {
            transform: translateY(-5px);
        }
        
        .memory-category {
            display: inline-block;
            background: #4facfe;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            margin-bottom: 10px;
        }
        
        .memory-importance {
            display: inline-block;
            background: #ff6b6b;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            margin-left: 10px;
        }
        
        .memory-content {
            font-size: 14px;
            line-height: 1.6;
            color: #333;
            margin-bottom: 10px;
        }
        
        .memory-meta {
            font-size: 12px;
            color: #666;
            border-top: 1px solid #e1e5e9;
            padding-top: 10px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .error {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .no-results {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.2em;
        }
        
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .memory-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎭 Mem0AI 记忆查询系统</h1>
            <p>通过用户ID和标签查询角色扮演记忆内容</p>
        </div>
        
        <div class="query-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="userId">用户ID:</label>
                    <input type="text" id="userId" placeholder="请输入用户ID" required>
                </div>
                
                <div class="form-group">
                    <label for="category">记忆分类:</label>
                    <select id="category" required>
                        <option value="">请选择分类</option>
                        <option value="profile">📋 用户档案</option>
                        <option value="behavioral_patterns">🔄 互动模式</option>
                        <option value="internal_monologue">💭 内心活动</option>
                        <option value="roleplay_scenarios">🎭 扮演场景</option>
                        <option value="event">⏰ 事件记录</option>
                        <option value="interaction">💬 互动交流</option>
                        <option value="all">📊 所有分类</option>
                    </select>
                </div>
            </div>
            
            <button class="btn" onclick="searchMemories()" id="searchBtn">
                🔍 查询记忆
            </button>
        </div>
        
        <div class="results-section" id="resultsSection" style="display: none;">
            <div class="results-header">
                <h2>查询结果</h2>
                <div class="results-count" id="resultsCount"></div>
            </div>
            
            <div id="resultsContainer"></div>
        </div>
    </div>

    <script>
        const categoryMap = {
            'profile': '📋 用户档案',
            'behavioral_patterns': '🔄 互动模式', 
            'internal_monologue': '💭 内心活动',
            'roleplay_scenarios': '🎭 扮演场景',
            'event': '⏰ 事件记录',
            'interaction': '💬 互动交流'
        };
        
        const importanceMap = {
            'high': '高',
            'medium': '中',
            'low': '低'
        };
        
        async function searchMemories() {
            const userId = document.getElementById('userId').value.trim();
            const category = document.getElementById('category').value;
            const searchBtn = document.getElementById('searchBtn');
            const resultsSection = document.getElementById('resultsSection');
            const resultsContainer = document.getElementById('resultsContainer');
            const resultsCount = document.getElementById('resultsCount');
            
            if (!userId || !category) {
                alert('请填写用户ID并选择分类');
                return;
            }
            
            searchBtn.disabled = true;
            searchBtn.textContent = '🔍 查询中...';
            
            resultsContainer.innerHTML = '<div class="loading">正在查询记忆数据...</div>';
            resultsSection.style.display = 'block';
            
            try {
                let url = '/api/v1/memory/query';
                let body = {
                    user_id: userId,
                    category: category,
                    limit: 100
                };
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(body)
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP错误: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    displayResults(data.results, category);
                    resultsCount.textContent = `共找到 ${data.results.length} 条记忆`;
                } else {
                    throw new Error(data.message || '查询失败');
                }
                
            } catch (error) {
                console.error('查询失败:', error);
                resultsContainer.innerHTML = `
                    <div class="error">
                        ❌ 查询失败: ${error.message}
                    </div>
                `;
                resultsCount.textContent = '查询失败';
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = '🔍 查询记忆';
            }
        }
        
        function displayResults(memories, selectedCategory) {
            const resultsContainer = document.getElementById('resultsContainer');
            
            if (!memories || memories.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="no-results">
                        📭 未找到相关记忆
                    </div>
                `;
                return;
            }
            
            // 新的查询API已经按分类过滤，直接显示所有结果
            const html = `
                <div class="memory-grid">
                    ${memories.map(memory => {
                        const metadata = memory.metadata || {};
                        const category = metadata.category || 'unknown';
                        const importance = metadata.importance || 'low';
                        const timestamp = memory.timestamp || memory.created_at || '未知时间';
                        
                        return `
                            <div class="memory-card">
                                <div class="memory-category">
                                    ${categoryMap[category] || category}
                                </div>
                                <div class="memory-importance">
                                    重要性: ${importanceMap[importance] || importance}
                                </div>
                                <div class="memory-content">
                                    ${memory.memory || memory.content || '无内容'}
                                </div>
                                <div class="memory-meta">
                                    <strong>ID:</strong> ${memory.id || '未知'} | 
                                    <strong>时间:</strong> ${new Date(timestamp).toLocaleString('zh-CN')}
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
            
            resultsContainer.innerHTML = html;
        }
        
        // 回车键搜索
        document.getElementById('userId').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchMemories();
            }
        });
        
        document.getElementById('category').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchMemories();
            }
        });
    </script>
</body>
</html>
